plugins {
    id "java"
    id "maven-publish"
    id "io.freefair.lombok" version "5.3.0"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.shop"
version "1.0.0"

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }

    maven {
        name "Scala"
        url "${property("minequest_artifactory_contextUrl")}/gradle-release"

        credentials {
            username property("minequest_artifactory_user")
            password property("minequest_artifactory_password")
        }
    }
}

dependencies {
    compileOnly "org.projectlombok:lombok:1.18.24"
    annotationProcessor "org.projectlombok:lombok:1.18.24"

    compileOnly "gg.scala.commons:bukkit:3.0.8"

    compileOnly "com.solexgames:Grape:1.0.0"
    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.chattags.plugin:scala-chattags-plugin:1.1.3"
    compileOnly "gg.scala.lemon:bukkit:1.5.0"
    compileOnly "gg.scala.spigot:server:1.1.0"
    compileOnly "gg.scala.tangerine:tangerine:1.2.2"
    compileOnly "gg.scala.cloudsync:spigot:1.0.1"
}

compileJava {
    options.compilerArgs += ["-parameters"]

    options.fork = true
    options.encoding = "UTF-8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "shop.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "$minequest_artifactory_contextUrl/$minequest_artifactory_release"

            credentials {
                username property("minequest_artifactory_user")
                password property("minequest_artifactory_password")
            }
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
